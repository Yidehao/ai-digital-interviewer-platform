<script>
	// Set Element UI locale to English
	if (typeof ELEMENT !== 'undefined' && ELEMENT.locale && ELEMENT.lang && ELEMENT.lang.en) {
		ELEMENT.locale(ELEMENT.lang.en);
	}

	// Override pagination text after Vue is loaded
	function replacePaginationText() {
		var totalElements = document.querySelectorAll('.el-pagination__total');
		totalElements.forEach(function (el) {
			var text = el.textContent || el.innerText;
			if (text && (text.includes('共') || text.includes('条') || text.match(/^\d+$/))) {
				var match = text.match(/(\d+)/);
				if (match) {
					el.textContent = 'Total ' + match[1] + ' items';
				} else if (!text.includes('Total')) {
					// If it's just a number, add Total and items
					var numMatch = text.trim();
					if (/^\d+$/.test(numMatch)) {
						el.textContent = 'Total ' + numMatch + ' items';
					}
				}
			}
		});
	}

	// Replace date picker Chinese text to English
	function replaceDatePickerText() {
		// 1) Fix month table first: set whole cell text so 十一月/十二月 show as Nov/Dec (not split 十 一 月)
		var monthMap = { '一月':'Jan','二月':'Feb','三月':'Mar','四月':'Apr','五月':'May','六月':'Jun','七月':'Jul','八月':'Aug','九月':'Sep','十月':'Oct','十一月':'Nov','十二月':'Dec' };
		document.querySelectorAll('.el-month-table td').forEach(function (td) {
			var t = (td.textContent || '').trim();
			if (monthMap[t]) { td.textContent = monthMap[t]; }
		});

		// 2) Replace text in leaf nodes (skip removing 年/月/日 from header labels here; done below)
		var allElements = document.querySelectorAll('.el-picker-panel *, .el-date-picker *, .el-date-table *, .el-month-table *, .el-year-table *');
		allElements.forEach(function (el) {
			if (el.children.length > 0) return;

			var text = el.textContent || el.innerText;
			if (text && text.trim()) {
				var originalText = text;
				// Replace month names (full month names)
				text = text.replace(/一月/g, 'Jan').replace(/二月/g, 'Feb').replace(/三月/g, 'Mar')
					.replace(/四月/g, 'Apr').replace(/五月/g, 'May').replace(/六月/g, 'Jun')
					.replace(/七月/g, 'Jul').replace(/八月/g, 'Aug').replace(/九月/g, 'Sep')
					.replace(/十月/g, 'Oct').replace(/十一月/g, 'Nov').replace(/十二月/g, 'Dec');

				// Replace weekday names (only if it's a single character weekday)
				if (/^[日一二三四五六]$/.test(text.trim())) {
					text = text.replace('日', 'Sun').replace('一', 'Mon').replace('二', 'Tue')
						.replace('三', 'Wed').replace('四', 'Thu').replace('五', 'Fri')
						.replace('六', 'Sat');
				}

				// Replace button and label text (do NOT remove 年/月/日 here for header - it breaks year/month navigation)
				text = text.replace(/今天/g, 'Today').replace(/昨天/g, 'Yesterday')
					.replace(/明天/g, 'Tomorrow').replace(/确定/g, 'OK').replace(/取消/g, 'Cancel');
				// Only remove 年/月/日 from elements that are NOT the main header label (header is handled below)
				if (!el.classList || !el.classList.contains('el-date-picker__header-label')) {
					text = text.replace(/年/g, '').replace(/月/g, '').replace(/日/g, '');
				}

				if (text !== originalText) {
					el.textContent = text;
				}
			}
		});

		// 3) Header labels: show year and month in English form (e.g. "2024 Nov") so year/month switching works
		var headerLabels = document.querySelectorAll('.el-date-picker__header-label');
		headerLabels.forEach(function (el) {
			var raw = (el.textContent || el.innerText).trim();
			if (!raw) return;
			// Match patterns like "2024年11月" or "2024 年 11 月" or "十一月"
			var yearMatch = raw.match(/(\d{4})\s*年?/);
			var monthMatch = raw.match(/(\d{1,2})\s*月?/);
			var monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
			if (yearMatch && monthMatch) {
				var y = yearMatch[1];
				var m = parseInt(monthMatch[1], 10);
				if (m >= 1 && m <= 12) {
					el.textContent = monthNames[m - 1] + ' ' + y;
					return;
				}
			}
			if (monthMatch && !yearMatch) {
				var m = parseInt(monthMatch[1], 10);
				if (m >= 1 && m <= 12) {
					el.textContent = monthNames[m - 1];
					return;
				}
			}
			// Fallback: only strip 年/月/日
			var text = raw.replace(/[年月日]/g, ' ').replace(/\s+/g, ' ').trim();
			if (text && text !== raw) { el.textContent = text; }
		});
	}

	document.addEventListener('DOMContentLoaded', function () {
		setTimeout(function () {
			replacePaginationText();
			replaceDatePickerText();
			// Watch for new pagination and date picker elements
			var observer = new MutationObserver(function (mutations) {
				replacePaginationText();
				// Check if date picker panel was added
				var hasDatePicker = document.querySelector('.el-picker-panel, .el-date-picker, .el-date-table');
				if (hasDatePicker) {
					setTimeout(replaceDatePickerText, 100);
				}
			});
			observer.observe(document.body, {
				childList: true,
				subtree: true
			});

			// When date picker is opened or user switches month/year, replace text again
			document.addEventListener('click', function (e) {
				if (e.target.closest('.el-date-editor, .el-date-picker, .el-picker-panel')) {
					setTimeout(replaceDatePickerText, 150);
					setTimeout(replaceDatePickerText, 400);
				}
			});
		}, 1000);
	});
</script>

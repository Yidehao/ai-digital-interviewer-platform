spring:
  application:
    name: interviewer
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB         # File upload size limit, maximum value set, cannot exceed, otherwise will error
      max-request-size: 10MB      # Maximum file request limit, can be used for batch upload
  flyway:
    enabled: true
    # An existing database is recorded as version 1 and V1__baseline.sql is skipped;
    # only V2 onwards apply. A fresh empty schema gets the full set.
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration


logging:
  level:
    root: info
  pattern:
    # requestId/sessionId on every line. An interview logs from three threads - the request thread,
    # the agent pool, and a tool executor - and without correlation ids the first question after any
    # incident ("show me everything from that one interview") is answered by guessing at timestamps.
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-}/%X{sessionId:-}] %logger{28} - %msg%n"


server:
  tomcat:
    uri-encoding: utf-8
    max-swallow-size: -1 # No limitation to request size



mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      banner: false
      update-strategy: not_empty
  mapper-locations: classpath*:/mapper/*.xml

# Pagination plugin helper configuration
pagehelper:
  helper-dialect: MYSQL
  support-methods-arguments: true

management:
  endpoints:
    web:
      exposure:
        # prometheus is the one that matters: interview_fallback_total{reason} is the metric that
        # says whether the model is actually driving the interview or the ladder is carrying it.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ai-digital-interviewer
